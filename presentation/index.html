<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KickerRank</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>KickerRank</h1>
    <nav>
      <button class="nav-button active" data-section="ranking">Ranking</button>
      <button class="nav-button" data-section="new-game">New game</button>
    </nav>
  </header>

  <main>
    <section id="ranking" class="page-section">
      <h2>Ranking</h2>
      <table id="ranking-table">
        <thead>
          <tr>
            <th data-key="place"></th>
            <th data-key="first_name">First name</th>
            <th data-key="last_name">Last name</th>
            <th data-key="department">Department</th>
            <th data-key="elo">Elo</th>
            <th data-key="games_played">Games</th>
          </tr>
        </thead>
        <tbody id="ranking-table-body">
        </tbody>
      </table>
    </section>

    <section id="new-game" class="page-section hidden">
      <h2>New game</h2>
      <form id="game-form" novalidate>
        <div class="match">
          <div class="side">
            <label for="player-a">Player A</label>
            <select id="player-a">
              <option value="">Choose player</option>
            </select>
            <label for="goals-a">Goals</label>
            <input type="number" id="goals-a" min="0" max="10">
          </div>

          <span class="versus">vs</span>

          <div class="side">
            <label for="player-b">Player B</label>
            <select id="player-b">
              <option value="">Choose player</option>
            </select>
            <label for="goals-b">Goals</label>
            <input type="number" id="goals-b" min="0" max="10">
          </div>
        </div>

        <button type="submit" class="submit-button">Save game</button>
        <ul id="game-errors" class="errors"></ul>
        <p id="game-success" class="success"></p>
      </form>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
